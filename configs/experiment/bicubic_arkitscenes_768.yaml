# Floor for ducos_arkitscenes: bicubic up from the real LiDAR grid, same 768x1024 frame
# (exactly x4), same frames and protocol.
# ARKitScenes upsampling Validation: real iPad LiDAR 256x192 in, Faro laser GT 1920x1440
defaults:
  - dataset: arkitscenes
  - model: bicubic
  - degradation: none

seed: 0
device: auto
dataset:
  target_size: [768, 1024]
eval:
  crop: none
  pooling: image
  min_depth: 0.05
  max_depth: 10.0
runtime:
  measure: true
  warmup: 3
  iters: 10
tracking:
  backend: none
notes: "floor for ducos_arkitscenes; real LiDAR input at 768x1024 (x4)"
