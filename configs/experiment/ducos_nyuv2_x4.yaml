# Regression anchor: DuCos paper (arXiv:2503.04171) Tab. 1, x4 NYU v2 RMSE = 2.60 cm.
# Reproduced 2026-10-05 on the server, PIL bicubic LR: 0.0260 m -> 2.60 cm -- exact.
# If this moves, the SR protocol or the adapter broke (see metrics_protocol.md).
# The classic synthetic x4 depth-SR protocol on NYUv2.
defaults:
  - dataset: nyuv2
  - model: ducos
  - degradation: bicubic_x4

seed: 0
device: auto
dataset:
  # The DSR npy pack is not on the server; these are the same 449 test frames
  # from the official labeled .mat. simulate_from: gt -- the .mat also carries
  # rawDepths (real Kinect), which would otherwise replace the bicubic input.
  layout: mat
  mat_range: [1000, 1449]
  simulate_from: gt
model:
  checkpoint: checkpoints/ducos/x4.pth.tar
  scale: 4
eval:
  crop: border6
  pooling: image
  min_depth: 0.001
  max_depth: 10.0
runtime:
  measure: true
  warmup: 10
  iters: 50
tracking:
  backend: none
