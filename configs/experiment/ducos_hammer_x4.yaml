# HAMMER, super-resolution of the REAL D435 depth: the sensor map (holes nearest-filled first) is shrunk
# 4x by PIL bicubic and the method restores it; scored against the laser GT.
# Input keeps the sensor's own errors, GT is independent -> honest. DuCos x4, zero-shot.
defaults:
  - dataset: hammer
  - model: ducos
  - degradation: bicubic_x4

seed: 0
device: auto
degradation:
  fill_holes: true     # D435 has holes; see sr_downsample.py
dataset:
  simulate_from: sensor
model:
  checkpoint: checkpoints/ducos/x4.pth.tar
  scale: 4
eval:
  crop: none
  pooling: image
  min_depth: 0.1
  max_depth: 5.0
runtime:
  measure: true
  warmup: 10
  iters: 50
tracking:
  backend: none
notes: "x4 SR of real D435 depth; zero-shot; laser GT"
