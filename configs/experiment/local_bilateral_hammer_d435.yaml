# HAMMER, the REAL D435 depth (active stereo, the same principle as Astra 2) as the input, no simulation;
# scored against the laser GT. Depth Anything V2 calibrated on the dense D435 pixels (RGB-aware completion).
defaults:
  - dataset: hammer
  - model: local_bilateral
  - degradation: none

seed: 0
device: auto
eval:
  crop: none
  regions: sensor_holes   # metrics also split by the real sensor's holes
  pooling: image
  min_depth: 0.1
  max_depth: 5.0
runtime:
  measure: true
  warmup: 3
  iters: 10
tracking:
  backend: none
notes: "DAv2 + dense D435 anchors, no task training; laser GT"
