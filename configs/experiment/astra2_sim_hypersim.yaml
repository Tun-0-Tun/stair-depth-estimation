# The core experiment of the project: how well does a dToF-trained baseline do
# on ACTIVE-STEREO-degraded input? Answer = the domain gap we must close.
# Requires the hypersim loader (stub) - see data/loaders/hypersim.py.
defaults:
  - dataset: hypersim
  - model: depthor
  - degradation: astra2_uncalibrated

seed: 0
device: cuda
eval:
  crop: none
  pooling: image
  max_samples: 500
  min_depth: 0.6
  max_depth: 8.0
runtime:
  measure: true
  warmup: 10
  iters: 50
tracking:
  backend: none
notes: "degradation UNCALIBRATED - see docs/design_doc.md#astra-2-noise-model"
