# ⚠ MEASURED INVALID -- do not report these numbers as a method comparison.
# VOID's input is ~740 real VIO points, 0.24% of the pixels. Densified onto the
# H/8 grid (60x80 cells) only ~15% of cells carry a measurement; the rest is
# nearest-neighbour fill. A super-resolution model is then asked to upsample
# mostly-invented data, and on 10 frames WAVE, bicubic and nn_fill agreed to the
# third decimal (absrel 0.163 / 0.153 / 0.151, delta1 0.800 / 0.808 / 0.809) --
# every one of them was measuring the quality of the fill, not of the method.
# VOID is a depth-*completion* benchmark; for a real SR protocol see
# wave_minjiang_x8, where the same checkpoint beats bicubic by 27-46%.
# Kept so the finding is reproducible. See docs/metrics_protocol.md.
# WAVE x8 on VOID stairs, real sparse VIO input (no simulation).
# VOID ships real sparse depth, so the scale is not a degradation (the loader
# would ignore one): lr_scale densifies the real points onto the H/8 grid, and
# must equal model.scale or the adapter resamples a second time.
# Zero-shot: the x8 weights are trained on HyperSim, never on VOID.
defaults:
  - dataset: void_stairs
  - model: wave
  - degradation: none

seed: 0
device: auto
dataset:
  lr_scale: 8
model:
  checkpoint: checkpoints/wave/NYU8x.pth
  scale: 8
eval:
  crop: none
  pooling: image
  min_depth: 0.2
  max_depth: 10.0
runtime:
  measure: true
  warmup: 10
  iters: 50
tracking:
  backend: none
notes: "INVALID PROTOCOL: SR on 0.24%-dense VIO input, H/8 grid is mostly nn-fill; ties with bicubic; zero-shot"
