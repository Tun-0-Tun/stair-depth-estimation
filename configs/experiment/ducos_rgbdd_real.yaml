# Reproduce DuCos on RGB-D-D with the genuine low-resolution ToF frame.
defaults:
  - dataset: rgbdd
  - model: ducos
  - degradation: none

seed: 0
device: auto
dataset:
  downsample: real
model:
  checkpoint: checkpoints/ducos/RealRGBDD.pth.tar
eval:
  crop: border6         # DuCos crops a 6-pixel border before scoring
  pooling: image
  min_depth: 0.1
  max_depth: 10.0
runtime:
  measure: true
  warmup: 10
  iters: 50
tracking:
  backend: none
