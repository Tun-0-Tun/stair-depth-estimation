# HAMMER, super-resolution of the REAL D435 depth: the sensor map (holes nearest-filled first) is shrunk
# 4x by PIL bicubic and the method restores it; scored against the laser GT.
# Input keeps the sensor's own errors, GT is independent -> honest. Floor for the x4 rows.
defaults:
  - dataset: hammer
  - model: bicubic
  - degradation: bicubic_x4

seed: 0
device: auto
degradation:
  fill_holes: true     # D435 has holes; see sr_downsample.py
dataset:
  simulate_from: sensor
eval:
  crop: none
  regions: sensor_holes   # metrics also split by the real sensor's holes
  pooling: image
  min_depth: 0.1
  max_depth: 5.0
runtime:
  measure: true
  warmup: 3
  iters: 10
tracking:
  backend: none
notes: "floor for x4 SR; real D435 input; laser GT"
