# DORNet x4 NYU v2 (synthetic bicubic protocol, the same one as ducos_nyuv2_x4).
# Regression anchor: DORNet paper (arXiv:2410.11666) Tab. 3, synthetic NYU-v2 x4 RMSE = 1.19 cm.
# Reproduced 2026-10-13 on the server, PIL bicubic LR, deformable conv via baselines/mmcv_shim.py
# (deform=shim): 0.0119 m -> 1.19 cm -- exact. This also confirms the DuCos-style min-max
# normalisation of RGB and depth is right for DORNet. If this moves, the SR protocol or the shim broke.
defaults:
  - dataset: nyuv2
  - model: dornet
  - degradation: bicubic_x4

seed: 0
device: auto
dataset:
  # Same 449 test frames as ducos_nyuv2_x4: the DSR npy pack is not on the server,
  # so they come from the official labeled .mat. simulate_from: gt -- the .mat also
  # carries rawDepths (real Kinect), which would otherwise replace the simulated input.
  layout: mat
  mat_range: [1000, 1449]
  simulate_from: gt
model:
  checkpoint: third_party/dornet/checkpoints/NYU_X4.pth
  scale: 4
eval:
  crop: border6
  pooling: image
  min_depth: 0.001
  max_depth: 10.0
runtime:
  measure: true
  warmup: 10
  iters: 50
tracking:
  backend: none
notes: "min/max from the LR input as in the DuCos adapter; deform=shim (torchvision DCNv2)"
