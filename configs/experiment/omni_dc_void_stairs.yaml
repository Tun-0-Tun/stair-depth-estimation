# OMNI-DC v1.1 on VOID stairs with VOID's own real input: ~740 VIO points (0.24% of pixels), no simulation.
# Completion is the protocol VOID is made for (the SR methods are invalid here, see wave_void_stairs_x8).
# Compare with nn_fill / bicubic (absrel ~0.151, delta1 ~0.809) and local_bilateral on the same data.
# GT is a dense reference with sensor-grade noise (scripts/audit_gt.py: 3.4 mm at 1.5-3 m, 13 mm at 3-6 m).
defaults:
  - dataset: void_stairs
  - model: omni_dc
  - degradation: none

seed: 0
device: auto
eval:
  crop: none
  pooling: image
  min_depth: 0.2
  max_depth: 10.0
runtime:
  measure: true
  warmup: 3
  iters: 10
tracking:
  backend: none
notes: "zero-shot; real VIO input, 0.24% coverage; stairs"
