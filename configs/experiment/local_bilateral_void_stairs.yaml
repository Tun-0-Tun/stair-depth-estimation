# local_bilateral on VOID stairs -- the case the SR baselines could not do.
#
# VOID ships ~740 real sparse VIO points, 0.24% of the pixels. That is too sparse
# for a super-resolution framing (wave_void_stairs_* documents why), but it is
# exactly what this method wants: sparse metric anchors plus a monocular prior.
# Compare against nn_fill and bicubic on the same data, which ignore RGB and both
# land at absrel about 0.151, delta1 about 0.809.
defaults:
  - dataset: void_stairs
  - model: local_bilateral
  - degradation: none

seed: 0
device: auto
runtime:
  measure: true
  warmup: 3
  iters: 10
tracking:
  backend: none
eval:
  crop: none
  pooling: image
  min_depth: 0.2
  max_depth: 10.0
notes: "RGB-aware floor, no training; real VIO input, 0.24% coverage"
