# DEPTHOR v1 on real stairs, simulated 8x8 dToF (dtof_l5_center). Zero-shot from ZJU-L5.
# rgbd_stair: 154 real stair frames, GT is the 8-bit-quantised sensor (~18 mm step) -> optimistic
defaults:
  - dataset: rgbd_stair
  - model: depthor
  - degradation: dtof_l5_center

seed: 0
device: auto
eval:
  crop: none
  pooling: image
  min_depth: 0.2
  max_depth: 10.0
runtime:
  measure: true
  warmup: 10
  iters: 50
tracking:
  backend: none
notes: "zero-shot; simulated dToF; sensor-as-GT"
