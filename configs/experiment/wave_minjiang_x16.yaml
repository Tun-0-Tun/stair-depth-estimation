# WAVE x16 on MinJiang stairs (synthetic bicubic protocol).
# MinJiang is gt_only, so the LR input is simulated: bicubic_x16 downsamples the
# GT to H/16, which is exactly the grid model.scale expects.
# The "GT" is the sensor's own depth, not an independent reference -> metrics
# are optimistic; label any number. Zero-shot: x16 weights are NYUv2.
defaults:
  - dataset: minjiang
  - model: wave
  - degradation: bicubic_x16

seed: 0
device: auto
model:
  checkpoint: checkpoints/wave/NYU16x.pth
  scale: 16
eval:
  crop: none
  pooling: image
  min_depth: 0.3
  max_depth: 8.0
runtime:
  measure: true
  warmup: 10
  iters: 50
tracking:
  backend: none
notes: "bicubic x16 from sensor depth (optimistic); min/max from the LR input; zero-shot"
