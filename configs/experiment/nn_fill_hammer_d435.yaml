# HAMMER, the REAL D435 depth (active stereo, the same principle as Astra 2) as the input, no simulation;
# scored against the laser GT. Floor = the sensor itself with its holes filled by the nearest value: how wrong D435 is.
defaults:
  - dataset: hammer
  - model: nn_fill
  - degradation: none

seed: 0
device: auto
eval:
  crop: none
  regions: sensor_holes   # metrics also split by the real sensor's holes
  pooling: image
  min_depth: 0.1
  max_depth: 5.0
runtime:
  measure: true
  warmup: 10
  iters: 50
tracking:
  backend: none
notes: "floor: raw D435 with holes nearest-filled; laser GT"
