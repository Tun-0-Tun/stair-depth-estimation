# Floor for wave_rgbd_stair_x8.
# rgbd_stair: 154 real stair frames, GT is the 8-bit-quantised sensor (~18 mm step) -> optimistic
defaults:
  - dataset: rgbd_stair
  - model: bicubic
  - degradation: bicubic_x8

seed: 0
device: auto
eval:
  crop: none
  pooling: image
  min_depth: 0.2
  max_depth: 10.0
runtime:
  measure: true
  warmup: 3
  iters: 10
tracking:
  backend: none
notes: "floor for x8 SR; GT-derived input"
