# WAVE x8 on MinJiang stairs (synthetic bicubic protocol).
# MinJiang is gt_only, so the LR input is simulated: bicubic_x8 downsamples the
# GT to H/8, which is exactly the grid model.scale expects.
# The "GT" is the sensor's own depth, not an independent reference -> metrics
# are optimistic; label any number. Zero-shot: x8 weights are HyperSim.
defaults:
  - dataset: minjiang
  - model: wave
  - degradation: bicubic_x8

seed: 0
device: auto
model:
  checkpoint: checkpoints/wave/NYU8x.pth
  scale: 8
eval:
  crop: none
  pooling: image
  min_depth: 0.3
  max_depth: 8.0
runtime:
  measure: true
  warmup: 10
  iters: 50
tracking:
  backend: none
notes: "bicubic x8 from sensor depth (optimistic); min/max from the LR input; zero-shot"
