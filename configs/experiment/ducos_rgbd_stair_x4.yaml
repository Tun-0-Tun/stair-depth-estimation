# DuCos x4 on real stairs, bicubic x4 from GT. Zero-shot (synthetic x4 weights).
# rgbd_stair: 154 real stair frames, GT is the 8-bit-quantised sensor (~18 mm step) -> optimistic
defaults:
  - dataset: rgbd_stair
  - model: ducos
  - degradation: bicubic_x4

seed: 0
device: auto
model:
  checkpoint: checkpoints/ducos/x4.pth.tar
  scale: 4
eval:
  crop: none
  pooling: image
  min_depth: 0.2
  max_depth: 10.0
runtime:
  measure: true
  warmup: 10
  iters: 50
tracking:
  backend: none
notes: "bicubic x4 from sensor GT; zero-shot"
