# Regression anchor: WAVE paper (arXiv:2608.25302) Tab. 3 (NYU-trained), x16 NYU v2 RMSE = 4.60 cm.
# Reproduced 2026-10-05 on the server, PIL bicubic LR: 0.0461 m -> 4.61 cm.
# WAVE x16 guided depth SR on NYUv2 (synthetic bicubic protocol).
defaults:
  - dataset: nyuv2
  - model: wave
  - degradation: bicubic_x16

seed: 0
device: auto
dataset:
  # The DSR npy pack is not on the server; these are the same 449 test frames
  # from the official labeled .mat. simulate_from: gt -- the .mat also carries
  # rawDepths (real Kinect), which would otherwise replace the bicubic input.
  layout: mat
  mat_range: [1000, 1449]
  simulate_from: gt
model:
  checkpoint: checkpoints/wave/NYU16x.pth
  scale: 16
eval:
  crop: border6
  pooling: image
  min_depth: 0.001
  max_depth: 10.0
runtime:
  measure: true
  warmup: 10
  iters: 50
tracking:
  backend: none
notes: "min/max from the LR input, not GT as upstream; rgb_norm unverified"
