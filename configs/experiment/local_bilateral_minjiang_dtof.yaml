# local_bilateral on MinJiang stairs, simulated 8x8 dToF.
#
# Same protocol as depthor_minjiang and nn_fill_minjiang_dtof, so the three rows
# are directly comparable: 64 zone values in, one pixel per zone. dtof_l5_center,
# not dtof_l5 -- see docs/metrics_protocol.md.
#
# MinJiang's GT is the sensor's own depth, so every number here is optimistic.
defaults:
  - dataset: minjiang
  - model: local_bilateral
  - degradation: dtof_l5_center

seed: 0
device: auto
runtime:
  measure: true
  warmup: 3
  iters: 10
tracking:
  backend: none
eval:
  crop: none
  pooling: image
  min_depth: 0.3
  max_depth: 8.0
notes: "RGB-aware floor, no training; simulated dToF (uncalibrated); GT is the sensor itself"
