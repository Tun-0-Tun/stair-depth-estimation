base: a1_validity.yaml
# REFERENCE for "ordinary data": WAVE fine-tuned on NYUv2 only (frames 0..899 of the labeled pack), under OUR sensor chain,
# validity channel as in row 1.  Model selection on NYU frames 900..999 (test = 1000..1448 stays untouched).
# Run with  degradation.preset=sequence_bicubic_x8_fill_lateral_projector_axial  (extras need a sensor chain).
# Compare on ours-test (train.py writes test.json) and with scripts/eval_nyu.py on NYU test.
data:
  train_ours: false
  extra:
    - {dataset: nyuv2, target_size: [528, 688], native_size: [480, 640], stair_terms: none,
       normals_K: [557.77, 571.42, 350.0, 279.11], loader_cfg: {force_normals: true, mat_range: [0, 900]}}
  val_extra: {dataset: nyuv2, target_size: [528, 688], native_size: [480, 640], stair_terms: none,
              normals_K: [557.77, 571.42, 350.0, 279.11], loader_cfg: {force_normals: true, mat_range: [900, 1000]}}
