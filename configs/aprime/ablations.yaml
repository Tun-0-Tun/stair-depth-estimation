# Rows of the ablation table, in order. `kind: train` = fine-tune then evaluate; `eval` = evaluate only.
# `requires: intrinsics` rows are skipped until data.intrinsics is set.
rows:
  - {id: "0",  name: "WAVE zero-shot",                       config: r0_wave_zeroshot.yaml, kind: eval}
  - {id: "1",  name: "WAVE + validity channel (fine-tuned)", config: a1_validity.yaml,      kind: train}
  - {id: "2",  name: "+ fusion=stairnetv2_orig",             config: a2_fusion_orig.yaml,   kind: train}
  - {id: "2b", name: "+ fusion=channel",                     config: a2b_fusion_channel.yaml, kind: train}
  - {id: "2c", name: "+ fusion=spatial",                     config: a2c_fusion_spatial.yaml, kind: train}
  - {id: "3a", name: "+ edge_weight=binary",                 config: a3a_edge_binary.yaml,  kind: train}
  - {id: "3b", name: "+ edge_weight=gaussian",               config: a3b_edge_gaussian.yaml, kind: train}
  - {id: "4",  name: "+ planar loss",                        config: a4_planar.yaml,        kind: train, requires: intrinsics}
  - {id: "5",  name: "all (best of 2*, 3*)",                 config: a5_all.yaml,           kind: train, combine: true}
  - {id: "6",  name: "planar loss + Gaussian edge weight", config: a6_planar_edge.yaml, kind: train, requires: intrinsics}
  - {id: "M0", name: "row 6, stair terms only on strict stair-like frames", config: m0_ours_gated.yaml, kind: train, requires: intrinsics}
  - {id: "M1", name: "ours + VOID + Hypersim, no stair terms (control)", config: m1_mix_nostair.yaml, kind: train}
  - {id: "M2", name: "ours + VOID + Hypersim, stair terms gated", config: m2_mix_gated.yaml, kind: train, requires: intrinsics}
  - {id: "W0", name: "pure WAVE fine-tuned (no validity channel)", config: w0_pure.yaml, kind: train}
  - {id: "N0", name: "reference: WAVE fine-tuned on NYUv2 only (our chain)", config: n0_nyu_only.yaml, kind: train}
  - {id: "DuCos",  name: "DuCos",   config: r_ducos.yaml,   kind: eval}
  - {id: "DEPTHOR", name: "DEPTHOR v1 (8x8 zone input)", config: r_depthor.yaml, kind: eval}
  - {id: "N1", name: "M0 + NYUv2 (300 frames, our chain, no stair terms)", config: n1_mix_nyu.yaml, kind: train, requires: intrinsics}
  - {id: "D1", name: "N1 + randomised training degradation (levels x jitter)", config: d1_random_degradation.yaml, kind: train, requires: intrinsics}
  - {id: "G1", name: "N1 + GT-depth-jump edge weight on all frames", config: g1_gt_edge.yaml, kind: train, requires: intrinsics}
  - {id: "N1s", name: "M0 + NYUv2 150 frames (dose-response)", config: n1s_mix_nyu_150.yaml, kind: train, requires: intrinsics}
  - {id: "N3", name: "M0 + NYUv2 900 frames (dose-response)", config: n3_mix_nyu_all.yaml, kind: train, requires: intrinsics}
