base: m0_ours_gated.yaml
# z1 (interpolated 8x8 zones, no validity channel) with the depth normalised by the FIXED sensor range 0.6..8 m instead of the
# min-max of the zone map. The dToF reports nothing beyond 4 m, so on deep frames the zone range is narrow and the GT falls far
# outside [0, 1] (z1: frames with < 45 zones of 64 had AbsRel 0.20, the rest 0.05-0.07).
data: {zones_input: {mode: interp, grid: [8, 8], interp: bilinear, norm: sensor}}
model: {use_validity_channel: false}
