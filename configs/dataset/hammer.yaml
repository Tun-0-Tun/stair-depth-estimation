name: hammer
loader: hammer
root: HAMMER
split: test
# Consecutive frames of a trajectory are near-duplicates, and 1224x1024 frames make every
# method slow (local_bilateral: seconds per frame). Every 5th frame is ~570 of 2828,
# the same frames for every experiment on this sheet. frame_stride: 1 = all.
frame_stride: 5
# d435 = active stereo (closest to the Astra 2), l515 = dToF, tof = Lucid I-ToF
input_sensor: d435
# Real layout: <root>/<scene>_traj<n>_<m>/polarization/{rgb,_gt,depth_d435,depth_l515,depth_tof}.
# The RGB camera *is* the polarization camera, and the authors ship every depth
# stream already warped into its frame -- so rgb, GT and input are siblings there
# and all three are registered. The per-sensor folders one level up (d435/,
# l515_depth/, tof/) hold the same streams in each sensor's own frame; using
# those would mean doing the warp ourselves for no gain.
rgb_subdir: polarization/rgb
gt_subdir: polarization/_gt
input_subdir: polarization/depth_d435   # depth_l515 / depth_tof for the other sensors
rgb_glob: "*.png"
min_depth: 0.1
max_depth: 5.0
eval:
  crop: none
docs: docs/datasets.md#hammer
