# Patch-wise dropout: organic blobs of similar normal/depth and swollen edge regions vanish - NOT CALIBRATED.
# All numbers are hand-set defaults, not fitted to Astra 2 captures. Any result produced with
# this file must carry "uncalibrated" in the notes column.
type: block_dropout
patch_sources: [surface, edge]   # any of: surface, edge
tau_n_deg: 15.0                  # normals further apart break a surface / mark an edge pixel
tau_z: 0.05                      # relative depth jump |dz|/z with the same meaning
cell_px: [24, 64]                # Voronoi cell size range that cuts large surfaces into blobs
warp_px: 12.0                    # warp amplitude bending the Voronoi borders
window: 3                        # odd neighbourhood for edge detection
edge_width_px: 6.0               # edge pixels swell by a radius in [0.3, 1] x this
edge_sigma_px: 8.0
min_area_px: 64                  # smaller patches merge into the nearest larger one
merge_dist_px: 6.0
discard_small: false
p0: 0.1                          # drop probability = p0 + p_theta*(1-cos theta) + p_depth*z/z_ref
p_theta: 0.3
p_depth: 0.1
z_ref: 4.0
p_max: 0.9
grow_px: 3                       # each dropped patch grows/shrinks by a random int in [-3, 3]
ragged_px: 5.0                   # fractal border amplitude
ragged_sigma_px: 8.0             # coarsest octave correlation length
octaves: 3
fade_px: 3.0                     # speckled transition width at hole borders (0 = hard border)
island_frac: 0.05                # share of hole interior left valid as islands
