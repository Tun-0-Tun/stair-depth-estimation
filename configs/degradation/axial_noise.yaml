# Axial noise from a known normal map (Nguyen et al. 2012, Kinect values) - NOT calibrated for the Astra 2.
type: axial_noise

# ----- noise model -----
sigma0: 0.0012                 # std at depth z0, metres
alpha: 0.0019                  # coefficient of (D - z0)^2, metres^-1
z0: 0.4                        # depth of minimal noise, metres
beta: 0.00001                  # coefficient of the grazing term, metres^1.5
theta0: 60.0                   # degrees; grazing term starts here
theta_max: 89.0                # degrees; phi is clamped here
sigma_max: 0.1                 # cap on the std, metres

# ----- normal map -----
angle_reference: optical_axis  # optical_axis | viewing_ray (phi against the camera z axis | the per-pixel ray)
normal_resize_mode: guided     # guided | nearest | bilinear
normal_resize_order: normals   # normals (resize vectors, then theta) | theta (theta, then resize)
normal_threshold_deg: 10.0     # guided only: neighbours farther than this angle are another surface
fill_missing_theta: true       # fill pixels with no usable normal from the nearest one
