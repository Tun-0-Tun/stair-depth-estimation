# Lateral noise from a known normal map (Nguyen et al. 2012, Kinect v1 values)
type: lateral_noise

# ----- noise parameters -----
sigma0: 0.8
gamma: 0.035
theta_max: 89.0
sigma_max: 10.0
gauss_std: 1.0                  # std (pixels) of the Gaussian filter on the offset field
angle_reference: optical_axis   # optical_axis | viewing_ray

# ----- normal map parameters -----
normal_resize_mode: guided      # guided | nearest | bilinear
normal_resize_order: normals    # normals | theta
normal_threshold_deg: 10.0      # guided only: neighbours farther than this angle are another surface
fill_missing_theta: true
